<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Journey</title>
</head>
<body>
<style>
  :root{--deep:#0a1c2c;color-scheme:dark}
  [hidden]{display:none!important}
  html,body{background:var(--deep);height:100%}
  body{margin:0;padding-inline:16px;padding-block:16px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;min-height:100%}
  .frame{position:relative;width:fit-content;max-width:100%;background:#000;line-height:0;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden}
  canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none}
  .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 56%,rgba(6,16,28,.5) 100%)}
  #snd{position:absolute;top:8px;right:8px;width:36px;height:36px;display:grid;place-items:center;background:none;border:0;color:#8fc1d4;opacity:.55;cursor:pointer;padding:0}
  #snd:hover{opacity:1}
  #snd.off{opacity:.25}
  #snd.off .w{display:none}
  #snd:focus-visible{outline:2px solid #efd9b2}
  #snd{z-index:6}
  /* welcome card: the words are drawn on the canvas in the same lights as the ending; this layer only holds the icons and the click target */
  #welcome{position:absolute;inset:0;z-index:5;container-type:inline-size;cursor:pointer;-webkit-user-select:none;user-select:none;opacity:1;transition:opacity 2.6s ease,visibility 0s 2.6s}
  #welcome.gone{opacity:0;visibility:hidden;pointer-events:none}
  #welcome .hints{position:absolute;left:0;right:0;top:57%;display:flex;gap:clamp(16px,5cqw,44px);justify-content:center;align-items:center;color:#8fc1d4;opacity:0;animation:wl 2.4s ease 3.6s forwards}
  #welcome .hints svg{width:clamp(22px,3.8cqw,34px);height:auto;display:block;opacity:.75}
  #welcome #begin{position:absolute;left:50%;top:76%;width:21%;height:9.6%;transform:translate(-50%,-50%);background:rgba(239,217,178,.04);border:1px solid rgba(239,217,178,.4);border-radius:999px;cursor:pointer;padding:0;opacity:0;
    animation:wl 2.4s ease 3.2s forwards,pulse 3.6s ease-in-out 5.6s infinite}
  #welcome #begin:hover,#welcome #begin:focus-visible{background:rgba(239,217,178,.14);border-color:#efd9b2;outline:none}
  @keyframes wl{from{opacity:0}to{opacity:1}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,217,178,0)}50%{box-shadow:0 0 22px 2px rgba(239,217,178,.2)}}
  @media (prefers-reduced-motion:reduce){#welcome .hints,#welcome #begin{animation-duration:.01s;animation-delay:0s}}
</style>

<div class="frame" id="frame">
  <canvas id="c" aria-label="A wordless walk through our memories. Hold the left or right arrow key, or press and hold either side of the picture, to walk."></canvas>
  <div class="vig"></div>
  <div id="welcome" role="dialog" aria-label="The Journey">
    <div class="hints" aria-hidden="true">
      <!-- headphones -->
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-4a11 11 0 0 1 22 0v4"/><rect x="3.5" y="19" width="6" height="9" rx="2.4"/><rect x="22.5" y="19" width="6" height="9" rx="2.4"/></svg>
      <!-- arrow keys -->
      <svg viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="26" height="24" rx="5"/><rect x="36" y="4" width="26" height="24" rx="5"/><path d="M19 11l-6 5 6 5"/><path d="M45 11l6 5-6 5"/></svg>
      <!-- press and hold either side -->
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="18" height="28" rx="4"/><path d="M16 5v22" stroke-dasharray="2 3"/><circle cx="21.5" cy="17" r="2.6" fill="currentColor" stroke="none"/></svg>
    </div>
    <button id="begin" type="button" aria-label="Begin"></button>
  </div>
  <button id="snd" aria-label="Sound"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
</div>

<script>
'use strict';
/* =====================================================================
   EIGHT CHAPTERS — one long wordless walk.
   Every chapter is a stack of depth layers (far / mid / main / over / front)
   that slide at different speeds and dissolve into the next chapter.
   The world starts muted; each chapter blooms as you walk through its memory.
   There is nothing to press and nothing to read: the walk is the whole thing.
   ===================================================================== */
const VW=960,VH=540,CW=1900,PAD=200,N=13,WORLD=CW*N+260,BY=444,YMIN=424,YMAX=460,SPD=2.9,SATMIN=.3,FAC=.72,PF=.5,PM=.86,PR=1.28;
const cv=document.getElementById('c'),G0=cv.getContext('2d'),off=document.createElement('canvas'),og=off.getContext('2d');
let g=G0,KS=1,SAT=1,B=1,TX=0,XL=0,XR=VW,YT=0,YB=VH; // visible range in layer coordinates (wider than the canvas while the camera is zoomed out)

/* ---------- colour + geometry helpers ---------- */
const HC={};const H=h=>HC[h]||(HC[h]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sm=x=>{x=x<0?0:x>1?1:x;return x*x*(3-2*x);};
function cs(c,k){k=k||0;let r=c[0],gg=c[1],b=c[2];if(k>0){r+=(255-r)*k;gg+=(255-gg)*k;b+=(255-b)*k;}else if(k<0){const m=1+k;r*=m;gg*=m;b*=m;}
  if(SAT<1){const l=.3*r+.59*gg+.11*b;r=l+(r-l)*SAT;gg=l+(gg-l)*SAT;b=l+(b-l)*SAT;}
  return 'rgb('+(clamp(r,0,255)|0)+','+(clamp(gg,0,255)|0)+','+(clamp(b,0,255)|0)+')';}
function rgbS(c){let r=c[0],gg=c[1],b=c[2];if(SAT<1){const l=.3*r+.59*gg+.11*b;r=l+(r-l)*SAT;gg=l+(gg-l)*SAT;b=l+(b-l)*SAT;}return(r|0)+','+(gg|0)+','+(b|0);}
function hash(n){n=Math.imul(n^(n>>>15),n|1);n^=n+Math.imul(n^(n>>>7),n|61);return((n^(n>>>14))>>>0)/4294967296;}
function vnoise(x,seed){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return hash(i*374761+seed)*(1-u)+hash((i+1)*374761+seed)*u;}
function tri(a,b,c,col,k){const s=cs(col,(k||0)*FAC);g.fillStyle=s;g.strokeStyle=s;g.lineWidth=.7;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.closePath();g.fill();g.stroke();}
function Q(a,b,c,d,col,seed,sp){sp=sp==null?.08:sp;tri(a,b,c,col,(hash(seed)-.5)*2*sp);tri(a,c,d,col,(hash(seed+1)-.5)*2*sp-.03);}
function fan(pts,col,seed,sp){sp=sp==null?.14:sp;let cx=0,cy=0;pts.forEach(p=>{cx+=p[0];cy+=p[1];});cx/=pts.length;cy/=pts.length;
  for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length],ang=Math.atan2((p[1]+q[1])/2-cy,(p[0]+q[0])/2-cx);
    tri([cx,cy],p,q,col,(hash(seed+i*3)-.5)*2*sp+.13*Math.cos(ang+2.4));}}
function blob(x,y,rx,ry,col,seed,n,sp){n=n||8;const pts=[];for(let i=0;i<n;i++){const a=i/n*6.2832+hash(seed+i)*.4,r=.82+hash(seed+i+40)*.3;pts.push([x+Math.cos(a)*rx*r,y+Math.sin(a)*ry*r]);}fan(pts,col,seed,sp);}
function box(x,y,w,h,col,seed,dx,dy){dx=dx==null?10:dx;dy=dy==null?-8:dy;
  Q([x,y-h],[x+w,y-h],[x+w,y],[x,y],col,seed,.07);
  Q([x,y-h],[x+dx,y-h+dy],[x+w+dx,y-h+dy],[x+w,y-h],col,seed+3,.05);tri([x,y-h],[x+dx,y-h+dy],[x+w+dx,y-h+dy],col,.22);
  Q([x+w,y-h],[x+w+dx,y-h+dy],[x+w+dx,y+dy],[x+w,y],mixc(col,[0,0,0],.3),seed+6,.04);}
function R_(x,y,w,h,c){g.fillStyle=cs(c,0);g.fillRect(x,y,w,h);}
function pine(x,y,h,col,seed,snow){R_(x-3,y-h*.18,6,h*.18,H('#4a2f22'));
  for(let l=0;l<3;l++){const w=h*.3*(1-l*.2),ya=y-h*(.12+l*.24),ap=ya-h*.36;
    tri([x-w,ya],[x,ap],[x,ya],col,.1+(hash(seed+l)-.5)*.1);tri([x,ap],[x+w,ya],[x,ya],col,-.16+(hash(seed+l+5)-.5)*.1);
    if(snow){tri([x-w*.46,ap+(ya-ap)*.54],[x,ap],[x,ap+(ya-ap)*.54],snow,0);tri([x,ap],[x+w*.46,ap+(ya-ap)*.54],[x,ap+(ya-ap)*.54],snow,-.1);}}}
function glow(x,y,r,col,a){if(!(a>0)||!(r>0))return;if(a>1)a=1;const c=rgbS(col),gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba('+c+','+a+')');gr.addColorStop(1,'rgba('+c+',0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
function al(a,fn){if(!(a>0))return;g.save();g.globalAlpha=Math.min(1,a);fn();g.restore();}
function line(x0,y0,x1,y1,c,w,a){g.save();g.globalAlpha=a==null?1:clamp(a,0,1);g.strokeStyle=cs(c,0);g.lineWidth=w||1;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();g.restore();}
function ring(x,y,r,c,a,w){if(!(a>0)||!(r>0))return;g.save();g.globalAlpha=Math.min(1,a);g.strokeStyle=cs(c,0);g.lineWidth=w||1;g.beginPath();g.arc(x,y,r,0,6.2832);g.stroke();g.restore();}
function heart(x,y,s,col,a){if(!(a>0))return;g.save();g.globalAlpha=Math.min(1,a);g.translate(x,y);g.scale(s,s);g.fillStyle=cs(col);g.beginPath();g.moveTo(0,7);g.bezierCurveTo(-15,-4,-7,-14,0,-5);g.bezierCurveTo(7,-14,15,-4,0,7);g.fill();g.restore();}
function spark(x,y,s,col){fan([[x,y-s*1.5],[x+s,y],[x,y+s*1.5],[x-s,y]],col,7,.08);}

/* named colours */
const OR=H('#e2782f'),AM=H('#eaa54b'),SA=H('#efd9b2'),CL=H('#8a4a2c'),TE=H('#2d6a86'),NV=H('#12324a'),SK=H('#8fc1d4'),DK=H('#0a1c2c'),TC=H('#b5532b'),UM=H('#3a2218');

/* ---------- palettes per chapter (blended while walking) ---------- */
const mkP=p=>({sky:p.sky.map(H),far:H(p.far),mid:H(p.mid),near:H(p.near),gr:H(p.gr),pa:H(p.pa),sc:H(p.sun.c),sx:p.sun.x,sy:p.sun.y,sr:p.sun.r,sg:p.sun.g,st:p.st,hk:p.hk==null?1:p.hk});
const PALS=[
 {sky:['#0b1d33','#1c4566','#e07a3a'],far:'#14324d',mid:'#1d4c69',near:'#0f2f42',gr:'#24343f',pa:'#4b4a4a',sun:{x:730,y:120,r:24,c:'#cfe3ea',g:.5},hk:1,st:.95},
 {sky:['#6f97b8','#a9c4d6','#efe0cc'],far:'#8fadc4',mid:'#b6cbd9',near:'#dfe8ee',gr:'#e6edf0',pa:'#cbd7dd',sun:{x:260,y:150,r:36,c:'#f6d9a8',g:.4},hk:0.8,st:0},
 {sky:['#6f89a8','#b4c3d2','#ece3cc'],far:'#5f7f6a',mid:'#7f9060',near:'#6a7f4a',gr:'#8f8a52',pa:'#b59a60',sun:{x:620,y:140,r:30,c:'#fff3d0',g:.35},hk:.22,st:0},
 {sky:['#0e1b2b','#14283d','#1c3a55'],far:'#1a3047',mid:'#22405a',near:'#17293a',gr:'#282d33',pa:'#3b3f44',sun:{x:600,y:420,r:0,c:'#ffcf7a',g:0},hk:1,st:.1},
 {sky:['#24608a','#7fb2c4','#f2b87a'],far:'#3f7f97',mid:'#b5653a',near:'#8f4a2c',gr:'#a7683f',pa:'#cf9a63',sun:{x:790,y:230,r:46,c:'#ffe0a0',g:.6},hk:0.5,st:0},
 {sky:['#1f3a5c','#6a5a7a','#e89a5a'],far:'#3a5570',mid:'#7a4a3a',near:'#5a3a2c',gr:'#6a4a38',pa:'#9a7250',sun:{x:700,y:330,r:38,c:'#ffc88a',g:.5},hk:.5,st:.3},
 {sky:['#0a1730','#123456','#2b5d7a'],far:'#0f2a45',mid:'#143a5a',near:'#0c2035',gr:'#3a2a20',pa:'#5a3e2c',sun:{x:250,y:100,r:30,c:'#f3ead2',g:.5},hk:0.9,st:1},
 {sky:['#081226','#12284a','#2b4a6a'],far:'#16324a',mid:'#1a3d3a',near:'#12302c',gr:'#1f3a2a',pa:'#2f5a3a',sun:{x:700,y:120,r:26,c:'#f3ead2',g:.5},hk:.7,st:1},
 {sky:['#1b3f4a','#3f7a78','#d9a35a'],far:'#2c5658',mid:'#3c6b5a',near:'#2a4d44',gr:'#4a3f2e',pa:'#6b5a3c',sun:{x:560,y:290,r:42,c:'#f3d58c',g:.5},hk:1,st:.2},
 {sky:['#0a1428','#1f3f70','#e37a3f'],far:'#14294a',mid:'#1b3560',near:'#101f3a',gr:'#2a2f3c',pa:'#4a4e5a',sun:{x:250,y:110,r:28,c:'#f0e6cf',g:.5},hk:0.7,st:.85},
 {sky:['#0f1f3a','#2a4a6a','#d98a5a'],far:'#17324d',mid:'#1f4460',near:'#12283c',gr:'#3a2a20',pa:'#5a3e2c',sun:{x:720,y:130,r:28,c:'#f3ead2',g:.5},hk:.9,st:.7},
 {sky:['#3a6a9a','#a9c4d6','#f2c48a'],far:'#5a7f9a',mid:'#6a5a52',near:'#4a3f3c',gr:'#55524e',pa:'#8a8478',sun:{x:300,y:150,r:34,c:'#fff0c8',g:.5},hk:.5,st:0},
 {sky:['#081226','#14294e','#7a4a5a'],far:'#122a48',mid:'#16335a',near:'#0e1e38',gr:'#22283a',pa:'#3a4050',sun:{x:250,y:110,r:28,c:'#f0e6cf',g:.5},hk:.8,st:.9}
].map(mkP);
const FINP=mkP({sky:['#050b1c','#10224a','#b8562e'],far:'#0f2440',mid:'#132c50',near:'#0c1a30',gr:'#1f2532',pa:'#3a3f4c',sun:{x:820,y:-90,r:0,c:'#f0e6cf',g:0},hk:.8,st:1});
function mixP(a,b,t){const m=(x,y)=>mixc(x,y,t);return{sky:a.sky.map((c,i)=>m(c,b.sky[i])),far:m(a.far,b.far),mid:m(a.mid,b.mid),near:m(a.near,b.near),gr:m(a.gr,b.gr),pa:m(a.pa,b.pa),sc:m(a.sc,b.sc),
  sx:lerp(a.sx,b.sx,t),sy:lerp(a.sy,b.sy,t),sr:lerp(a.sr,b.sr,t),sg:lerp(a.sg,b.sg,t),st:lerp(a.st,b.st,t),hk:lerp(a.hk,b.hk,t),sat:a.sat==null?1:a.sat};}
const bloom=new Float32Array(N),BE=new Float32Array(N);
const satOf=ci=>lerp(SATMIN,1,BE[ci]);
function palAt(x){const u=clamp(x/CW-.5,0,N-1.001),i=Math.floor(u),f=u-i,w=sm((f-.18)/.64),p=mixP(PALS[i],PALS[i+1],w);p.sat=lerp(satOf(i),satOf(i+1),w);return p;}

/* ---------- world layers ---------- */
let P=PALS[0];
function layer(cam,p,baseY,amp,cw,seed,rows,colFn,freq){g.save();g.translate(0,S.cy*p);
  const off=cam*p,i0=Math.floor((off+XL)/cw)-1,i1=i0+Math.ceil((XR-XL)/cw)+3;
  const top=i=>baseY-amp*(.65*vnoise(i*freq,seed)+.35*vnoise(i*freq*2.7,seed+31));
  const V=(i,r)=>{const t=top(i),jx=(hash(seed+i*7+r*13)-.5)*cw*.55,y=r===0?t:(r===rows?VH+14:t+(VH+14-t)*r/rows+(hash(seed+i*11+r*5)-.5)*14);return[i*cw+jx-off,y];};
  for(let i=i0;i<i1;i++)for(let r=0;r<rows;r++){
    const a=V(i,r),b=V(i+1,r),c=V(i+1,r+1),d=V(i,r+1),h=hash(seed+i*5+r*9),col=colFn(r,rows),slope=r===0?(top(i)-top(i+1))/amp*.3:0,
      k1=(hash(seed+i*3+r)-.5)*.22+slope,k2=(hash(seed+i*3+r+50)-.5)*.22-.04+slope*.5;
    if(h>.5){tri(a,b,c,col,k1);tri(a,c,d,col,k2);}else{tri(a,b,d,col,k1);tri(b,c,d,col,k2);}}
  g.restore();}
const STARS=[];for(let i=0;i<120;i++)STARS.push([hash(i*3)*VW,hash(i*3+1)*340,.5+hash(i*3+2)*1.3]);
function mist(y,h,a){const s=rgbS(P.sky[2]),gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'rgba('+s+',0)');gr.addColorStop(.62,'rgba('+s+','+a+')');gr.addColorStop(1,'rgba('+s+',0)');g.fillStyle=gr;g.fillRect(XL,y,XR-XL,h);}
function drawSky(camC,t){
  const gr=g.createLinearGradient(0,0,0,440);gr.addColorStop(0,cs(P.sky[0]));gr.addColorStop(.52,cs(P.sky[1]));gr.addColorStop(.94,cs(P.sky[2]));
  g.fillStyle=gr;g.fillRect(XL,YT,XR-XL,YB-YT);
  for(let i=0;i<7;i++){const x=((hash(i+70)*1500-camC*.04+i*210)%1500+1500)%1500-260,y=50+hash(i+80)*280,r=150+hash(i+90)*190;glow(x,y,r,i%2?P.sky[2]:mixc(P.sky[1],[255,255,255],.25),.15);}
  if(P.st>.02){g.fillStyle='#fff';STARS.forEach((s,i)=>{const tw=.55+.45*Math.sin(t*1.7+i);g.globalAlpha=clamp(P.st*tw*(1-s[1]/430),0,1);g.fillRect(s[0],s[1],s[2],s[2]);});g.globalAlpha=1;}
  if(P.sr>1){const x=P.sx,y=P.sy,r=P.sr;glow(x,y,r*4.6,P.sc,.3*P.sg+.1);
    const g2=g.createRadialGradient(x-r*.2,y-r*.2,0,x,y,r);g2.addColorStop(0,cs(P.sc,.3));g2.addColorStop(.8,cs(P.sc));g2.addColorStop(1,cs(P.sc,-.08));g.fillStyle=g2;g.beginPath();g.arc(x,y,r,0,6.2832);g.fill();
    ring(x,y,r*1.75,P.sc,.34,1);ring(x,y,r*2.7,P.sc,.17,1);ring(x,y,r*4,P.sc,.07,1);
    for(let i=0;i<5;i++){const a=t*.06+i*1.257,rr=r*(i%2?1.75:2.7);g.fillStyle=cs(P.sc,.2);g.globalAlpha=.7;g.fillRect(x+Math.cos(a)*rr-1.5,y+Math.sin(a)*rr-1.5,3,3);}g.globalAlpha=1;}
}
const hillCol=(a,k)=>(r,n)=>mixc(a,P.sky[2],(r/n)*k+.06);

/* ---------- animation registry ---------- */
const anv={},running=new Map();
const VU=k=>anv[k]||0,PU=k=>Math.sin(Math.PI*(anv[k]||0)),RUN=k=>running.has(k)?1:0;
function trig(k,r){anv[k]=0;running.set(k,r||1/150);}

/* ---------- characters (smooth shapes, always in full colour) ---------- */
function cap(x0,y0,x1,y1,w,c){g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();}
function seg(x,y,len,ang,w,c){const ex=x+Math.sin(ang)*len,ey=y+Math.cos(ang)*len;cap(x,y,ex,ey,w,c);return[ex,ey];}
function dot(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,6.2832);g.fill();}
/* a bicycle, drawn around the rider's hip at (0,-38): wheels, frame, bars, saddle, cranks */
function bikeShape(col,ang){const hub=[[-12,-12],[30,-12]],bb=[8,-12],sd=[0,-36],hd=[21,-38];
